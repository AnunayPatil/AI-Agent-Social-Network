version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agent_network_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agent_network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agent_network_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgrespassword@db:5432/agent_network
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: gemini-1.5-flash
      GEMINI_EMBEDDING_MODEL: models/text-embedding-004
      DEMO_MODE: ${DEMO_MODE:-true}
      DEFAULT_RELEVANCE_THRESHOLD: 0.55
      MAX_CONVERSATION_DEPTH: 4
      MAX_RESPONSES_PER_POST: 6
      AUTO_NOTIFY_AGENTS: "true"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agent_network_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
